<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Production Workspace — MVP</title>

<!-- Inline base styles (original design system) -->
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#6366f1; --accent2:#8b5cf6;
    --green:#22c55e; --amber:#f59e0b; --gray:#6b7280; --red:#ef4444;
    --radius:10px; --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);padding:6px 10px;border-radius:8px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:white}
  button.ghost{background:transparent}
  input,select,textarea{
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--text)
  }
  header{
    display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);
    background:var(--panel);position:sticky;top:0;z-index:20
  }
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px}
  header .spacer{flex:1}
  header .deadline{color:var(--muted);font-size:12px}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 10px;border-radius:8px}
  nav button.active{background:var(--panel2);color:var(--text);border-color:var(--line)}
  main{padding:16px;max-width:100%;}
  .grid{display:grid;gap:12px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .card .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card .value{font-size:24px;font-weight:600;margin-top:6px}
  .card .sub{color:var(--muted);font-size:12px;margin-top:4px}
  .bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:8px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .section-title{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
  table{border-collapse:separate;border-spacing:0;width:100%}
  .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  thead th{position:sticky;top:0;background:var(--panel2);z-index:2;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  .sticky-col{position:sticky;left:0;background:var(--panel);z-index:1}
  thead .sticky-col{z-index:3;background:var(--panel2)}
  .cell{min-width:130px;cursor:pointer;border:1px dashed transparent;border-radius:8px;padding:6px 8px;transition:.15s}
  .cell:hover{border-color:var(--line);background:var(--panel2)}
  .chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
  .s-not_started{background:rgba(107,114,128,.18);color:#cbd5e1}
  .s-in_progress{background:rgba(245,158,11,.18);color:#fcd34d}
  .s-done{background:rgba(34,197,94,.18);color:#86efac}
  .meta{font-size:11px;color:var(--muted);margin-top:3px}
  .shotnum{font-weight:600}
  .desc{max-width:260px}
  .thumb{width:64px;height:40px;border-radius:6px;background:linear-gradient(135deg,#232734,#2d3342);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}
  .badge{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .popover{
    position:fixed;z-index:100;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:12px;width:280px
  }
  .popover h4{margin:0 0 8px;font-size:13px}
  .popover label{display:block;font-size:11px;color:var(--muted);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.4px}
  .popover .row{display:flex;gap:6px;flex-wrap:wrap}
  .popover .row button{flex:1;min-width:0}
  .popover .actions{display:flex;justify-content:space-between;margin-top:12px;gap:8px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal .dow{color:var(--muted);font-size:11px;text-transform:uppercase;text-align:center;padding:4px}
  .cal .day{min-height:96px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px}
  .cal .day .num{color:var(--muted);font-size:11px}
  .cal .day.today{border-color:var(--accent)}
  .evt{margin-top:4px;padding:3px 6px;border-radius:6px;font-size:11px;background:var(--panel2);border-left:3px solid var(--accent);cursor:pointer}
  .gantt{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;overflow:auto}
  .grow{display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center;margin:6px 0}
  .gtrack{position:relative;height:22px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .gbar{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;opacity:.85}
  .gfill{position:absolute;top:0;bottom:0;left:0;background:rgba(34,197,94,.45);border-radius:6px}
  .axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}
  .muted{color:var(--muted)}
  .kbd{border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px;background:var(--panel2)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:900px){.two{grid-template-columns:1fr}}

  #splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s ease,visibility .5s}
  #splash.done{opacity:0;visibility:hidden}
  #splash svg{width:96px;height:96px;overflow:visible;animation:sp-float 2.4s ease-in-out infinite}
  #splash .arm{transform-origin:14px 34px;animation:sp-clap 1.2s cubic-bezier(.5,0,.3,1) infinite}
  #splash .eye{transform-origin:center;transform-box:fill-box;animation:sp-blink 3.6s infinite}
  #splash .spark{animation:sp-spark 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  #splash .ttl{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:600}
  #splash .track{width:120px;height:3px;border-radius:3px;background:var(--panel2);overflow:hidden}
  #splash .track i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:sp-slide 1.3s ease-in-out infinite}
  @keyframes sp-clap{0%,55%{transform:rotate(-24deg)}70%,100%{transform:rotate(0)}}
  @keyframes sp-spark{0%,66%{opacity:0;transform:scale(.3)}72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
  @keyframes sp-float{50%{transform:translateY(-5px)}}
  @keyframes sp-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  @keyframes sp-slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  @media(prefers-reduced-motion:reduce){#splash *{animation:none!important}}

  /* Backend status pill */
  #backendStatus{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
  #backendStatus.ok{color:#86efac;border-color:#166534;background:rgba(34,197,94,.12)}
  #backendStatus.bad{color:#fca5a5;border-color:#7f1d1d;background:rgba(239,68,68,.12)}
</style>

<div id="splash" role="status" aria-label="Loading">
  <svg viewBox="0 0 96 96" fill="none">
    <rect x="12" y="38" width="72" height="46" rx="8" fill="#1e222b" stroke="#6366f1" stroke-width="3"/>
    <g class="arm"><rect x="12" y="20" width="72" height="14" rx="5" fill="#6366f1"/>
      <path d="M26 20l-8 14M42 20l-8 14M58 20l-8 14M74 20l-8 14" stroke="#e6e9ef" stroke-width="4" stroke-linecap="round"/></g>
    <ellipse class="eye" cx="36" cy="58" rx="3.5" ry="4.5" fill="#e6e9ef"/>
    <ellipse class="eye" cx="60" cy="58" rx="3.5" ry="4.5" fill="#e6e9ef"/>
    <path d="M42 68q6 5 12 0" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>

<header>
  <h1>🎬 Production Workspace</h1>
  <nav id="tabs">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="shotlist">Shot List</button>
    <button data-tab="calendar">Calendar</button>
    <button data-tab="gantt">Gantt</button>
    <button data-tab="milestones">Milestones</button>
    <button data-tab="import">Storyboard Import</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="spacer"></div>

</header>

<main id="view"></main>
<div id="popoverRoot"></div>

<!-- ============================================================
     MAIN APP SCRIPT
     ============================================================ -->
<script>
/* ---------- Config ---------- */
const API_BASE = ''; // same origin; Flask serves both HTML and /api/*
const LS_KEY = 'production-workspace-v1';

/* ---------- Utilities (kept from original) ---------- */
const $  = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];
const uid = () => Math.random().toString(36).slice(2, 9);
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}) : '—';
const iso = d => d ? new Date(d).toISOString().slice(0,10) : '';
const today = () => { const t = new Date(); t.setHours(0,0,0,0); return t; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => { const x = new Date(d); const day = (x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; };
const weeksBetween = (a,b) => Math.max(0, (b-a)/(1000*60*60*24*7));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

/* ---------- Seed (fallback only; server is source of truth) ---------- */
function seed() {
  const now = today();
  const start = addDays(now, -28);
  const deadline = addDays(now, 56);
  const people = [
    {id:'p1', name:'Director', color:'#6366f1'},
    {id:'p2', name:'Maya',     color:'#ec4899'},
    {id:'p3', name:'Jonas',    color:'#14b8a6'},
    {id:'p4', name:'Boshra',   color:'#f59e0b'},
    {id:'p5', name:'Leo',      color:'#8b5cf6'},
  ];
  const stages = [
    {id:'rough', name:'Rough Animation',    weight:3.0},
    {id:'tie',   name:'Tie Down',           weight:2.0},
    {id:'clean', name:'CleanUp',            weight:2.0},
    {id:'color', name:'Coloring',           weight:1.5},
    {id:'png',   name:'PNG Export',         weight:1.0},
    {id:'integ', name:'2D/3D Integration',  weight:2.0},
    {id:'light', name:'Lighting',           weight:2.0},
    {id:'comp',  name:'Compositing',        weight:2.0},
  ];
  const shotDefs = [
    ['SH010', 'Opening — wide valley, crow flies in', 'Establishing. Slow push in.', 'CROW: (caw)', 6],
    ['SH020', 'Main character wakes up',              'Close on face. Eyes open.',  '',            4],
    ['SH030', 'MC steps outside',                     'Reveal of the herd.',        'MC: "…"',     5],
    ['SH040', 'Crow circles above',                   'Herd reacts below.',         '',            3],
    ['SH050', 'MC approaches the herd',               'Tension builds.',            '',            7],
    ['SH060', 'Crow lands on fence',                  'Silhouette against sky.',    '',            2],
    ['SH070', 'MC reaches out',                       'Hand trembling.',            '',            4],
    ['SH080', 'Herd scatters',                        'Fast pan, dust.',            '',            5],
    ['SH090', 'MC runs after them',                   'Handheld feel.',             'MC: "Wait!"', 6],
    ['SH100', 'Crow follows',                         'Aerial shot.',               '',            3],
    ['SH110', 'MC stops, breathes',                   'Wide, quiet.',               '',            5],
    ['SH120', 'Final — MC and crow together',         'Sunset. Fade out.',          '',            8],
  ];
  const shots = shotDefs.map(([number, description, notes, dialogue, duration], i) => ({
    id: 'sh'+(i+1),
    number, description, notes, dialogue, duration,
    order: i,
    thumbnail: '',
    elements: [
      {id:'e'+(i+1)+'a', name:'Main Character'},
      {id:'e'+(i+1)+'b', name:'Crow / Herd'},
      {id:'e'+(i+1)+'c', name:'Layout'},
    ]
  }));
  const cells = {};
  shots.forEach((shot, si) => {
    shot.elements.forEach(el => {
      stages.forEach(st => {
        const key = `${shot.id}|${el.id}|${st.id}`;
        cells[key] = {
          status: 'not_started',
          assignee: people[(si + st.id.length) % people.length].id,
          due: iso(addDays(now, Math.floor(Math.random()*56) - 7)),
          completedAt: null,
        };
      });
    });
  });
  return {
    project: { name: 'The Film', start: iso(start), deadline: iso(deadline) },
    people, stages, shots, cells,
    weeklyTargets: {},
    importQueue: [],
  };
}

/* ---------- State + persistence ---------- */
let state = null;
let backendOK = false;

async function loadState() {
  try {
    const r = await fetch(`${API_BASE}/api/workspace`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (data && data.empty === undefined && data.shots) {
      backendOK = true;
      setBackendStatus(true);
      return data;
    }
    // server has no data yet → push seed
    backendOK = true;
    setBackendStatus(true);
    const s = seed();
    await saveState(s);
    return s;
  } catch (e) {
    console.warn('[workspace] backend unavailable, using localStorage:', e);
    backendOK = false;
    setBackendStatus(false);
    try {
      const cached = JSON.parse(localStorage.getItem(LS_KEY));
      if (cached) return cached;
    } catch {}
    return seed();
  }
}

async function saveState(s = state) {
  // Always keep a local cache (works offline / before backend is ready)
  try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {}
  if (!backendOK) return;
  try {
    await fetch(`${API_BASE}/api/workspace`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(s)
    });
  } catch (e) {
    console.warn('[workspace] save failed:', e);
  }
}

function setBackendStatus(ok) {
  const el = document.getElementById('backendStatus');
  if (!el) return;
  el.textContent = ok ? '● backend connected' : '● offline (local cache)';
  el.className = ok ? 'ok' : 'bad';
}

/* ---------- Lookups ---------- */
const shotById = id => state.shots.find(s => s.id === id);
const personById = id => state.people.find(p => p.id === id);
const stageById = id => state.stages.find(s => s.id === id);
const cellKey = (shotId, elemId, stageId) => `${shotId}|${elemId||'_'}|${stageId}`;
function getCell(shotId, elemId, stageId) {
  const k = cellKey(shotId, elemId, stageId);
  if (!state.cells[k]) state.cells[k] = { status:'not_started', assignee:null, due:'', completedAt:null };
  return state.cells[k];
}

/* ---------- Core logic ---------- */
function stageCompletion(stageId) {
  let done = 0, total = 0;
  state.shots.forEach(shot => {
    total += shot.duration;
    const elems = shot.elements;
    if (!elems.length) {
      if (getCell(shot.id, null, stageId).status === 'done') done += shot.duration;
    } else {
      const allDone = elems.every(el => getCell(shot.id, el.id, stageId).status === 'done');
      if (allDone) done += shot.duration;
    }
  });
  return total ? done / total : 0;
}
function overallCompletion() {
  let num = 0, den = 0;
  state.stages.forEach(st => { num += stageCompletion(st.id) * st.weight; den += st.weight; });
  return den ? num / den : 0;
}
function totalSeconds() { return state.shots.reduce((a,s)=>a+s.duration,0); }
function remainingSeconds() { return totalSeconds() * (1 - overallCompletion()); }
function weeksUntilDeadline() {
  return Math.max(0.1, weeksBetween(today(), new Date(state.project.deadline)));
}
function weeklyTargetForStage(stageId) {
  const remaining = totalSeconds() * (1 - stageCompletion(stageId));
  return remaining / weeksUntilDeadline();
}
function weeklySpeed(stageId, weeks=4) {
  const since = addDays(today(), -7*weeks).getTime();
  let doneSeconds = 0;
  state.shots.forEach(shot => {
    const elems = shot.elements;
    if (!elems.length) {
      const c = getCell(shot.id, null, stageId);
      if (c.status==='done' && c.completedAt && new Date(c.completedAt).getTime() >= since) doneSeconds += shot.duration;
    } else {
      const allDone = elems.every(el => {
        const c = getCell(shot.id, el.id, stageId);
        return c.status==='done' && c.completedAt && new Date(c.completedAt).getTime() >= since;
      });
      if (allDone) doneSeconds += shot.duration;
    }
  });
  return doneSeconds / weeks;
}
function forecast() {
  const results = state.stages.map(st => {
    const remaining = totalSeconds() * (1 - stageCompletion(st.id));
    const avg = weeklySpeed(st.id, 4);
    const best = weeklySpeed(st.id, 1);
    const worst = Math.max(0.01, avg * 0.6);
    const weeks = (speed) => speed > 0.01 ? remaining / speed : Infinity;
    const wkReal = weeks(avg), wkOpt = weeks(best), wkCaut = weeks(worst);
    const finish = w => isFinite(w) ? addDays(today(), Math.round(w*7)) : null;
    return {
      stage: st, remaining, avg, best, worst,
      realistic: finish(wkReal),
      optimistic: finish(wkOpt),
      cautious: finish(wkCaut),
      enoughData: avg > 0.05
    };
  });
  const withDates = results.filter(r => r.realistic);
  const bottleneck = withDates.sort((a,b)=> b.realistic - a.realistic)[0] || null;
  const overallRealistic = bottleneck ? bottleneck.realistic : null;
  const deadline = new Date(state.project.deadline);
  const diffWeeks = overallRealistic ? weeksBetween(deadline, overallRealistic) : 0;
  return { results, bottleneck, overallRealistic, diffWeeks };
}
function calendarEvents() {
  const events = [];
  state.shots.forEach(shot => {
    shot.elements.forEach(el => {
      state.stages.forEach(st => {
        const c = getCell(shot.id, el.id, st.id);
        if (c.due) {
          events.push({ date: c.due, shot, element: el, stage: st, cell: c, person: personById(c.assignee) });
        }
      });
    });
  });
  return events;
}
function weeklyActuals(weeks=8) {
  const buckets = [];
  for (let i=weeks-1; i>=0; i--) {
    const ws = startOfWeek(addDays(today(), -i*7));
    const we = addDays(ws, 7);
    let seconds = 0;
    state.shots.forEach(shot => {
      const elems = shot.elements;
      const stageDoneCount = state.stages.filter(st => elems.every(el => {
        const c = getCell(shot.id, el.id, st.id);
        return c.status==='done' && c.completedAt && new Date(c.completedAt) >= ws && new Date(c.completedAt) < we;
      })).length;
      seconds += shot.duration * (stageDoneCount / state.stages.length);
    });
    buckets.push({ weekStart: ws, seconds });
  }
  return buckets;
}

/* ---------- Views ---------- */
let currentTab = 'dashboard';

function render() {
  $('#deadlineLabel').textContent =
    `Deadline: ${fmtDate(state.project.deadline)} • ${Math.round(weeksUntilDeadline())} weeks left`;
  const view = $('#view');
  view.innerHTML = '';
  if (currentTab==='dashboard') renderDashboard(view);
  else if (currentTab==='shotlist') renderShotList(view);
  else if (currentTab==='calendar') renderCalendar(view);
  else if (currentTab==='gantt') renderGantt(view);
  else if (currentTab==='milestones') renderMilestones(view);
  else if (currentTab==='import') renderImport(view);
  else if (currentTab==='settings') renderSettings(view);
}

/* ---------- Dashboard ---------- */
function renderDashboard(root) {
  const overall = overallCompletion();
  const total = totalSeconds();
  const fc = forecast();
  const events = calendarEvents();
  const overdue = events.filter(e => new Date(e.date) < today() && e.cell.status !== 'done').length;

  const el = document.createElement('div');
  el.innerHTML = `
    <div class="grid cards">
      <div class="card">
        <div class="label">Overall completion</div>
        <div class="value">${Math.round(overall*100)}%</div>
        <div class="bar"><i style="width:${overall*100}%"></i></div>
        <div class="sub">${Math.round(total*(1-overall))}s of ${total}s remaining</div>
      </div>
      <div class="card">
        <div class="label">Deadline</div>
        <div class="value">${fmtDate(state.project.deadline)}</div>
        <div class="sub">${Math.round(weeksUntilDeadline())} weeks left</div>
      </div>
      <div class="card">
        <div class="label">Forecast (realistic)</div>

            .filter(e => {
              const d = new Date(e.date);
              return d >= today() && d <= addDays(today(), 14) && e.cell.status !== 'done';

            .sort((a,b)=> new Date(a.date) - new Date(b.date))

                <td>${e.element.name}</td>

}

function cellTd(shot, el, stage) {
  const c = getCell(shot.id, el ? el.id : null, stage.id);
  const p = personById(c.assignee);
  const overdue = c.due && new Date(c.due) < today() && c.status !== 'done';
  return `
    <td>
      <div class="cell" data-key="${cellKey(shot.id, el?el.id:null, stage.id)}">
        <span class="chip s-${c.status}">${c.status.replace('_',' ')}</span>
        <div class="meta">${p ? `<span style="color:${p.color}">●</span> ${p.name}` : '<span class="muted">unassigned</span>'}</div>
        <div class="meta" style="${overdue?'color:var(--red)':''}">${c.due ? (overdue?'⚠ ':'')+fmtDate(c.due) : '<span class="muted">no date</span>'}</div>
      </div>
    </td>`;
}

/* ---------- Cell editor popover ---------- */
function openCellEditor(key, x, y) {
  closeEditor();
  const [shotId, elemIdRaw, stageId] = key.split('|');
  const elemId = elemIdRaw === '_' ? null : elemIdRaw;
  const c = getCell(shotId, elemId, stageId);
  const shot = shotById(shotId);
  const el = elemId ? shot.elements.find(e => e.id === elemId) : null;
  const stage = stageById(stageId);

  const pop = document.createElement('div');
  pop.className = 'popover';
  pop.innerHTML = `
    <h4>${shot.number}${el ? ' · '+el.name : ''} — ${stage.name}</h4>
    <label>Status</label>
    <div class="row" id="statusRow">
      <button data-s="not_started" class="${c.status==='not_started'?'primary':''}">Not started</button>
      <button data-s="in_progress" class="${c.status==='in_progress'?'primary':''}">In progress</button>
      <button data-s="done" class="${c.status==='done'?'primary':''}">Done</button>
    </div>
    <label>Assignee</label>
    <select id="assignee" style="width:100%">
      <option value="">— unassigned —</option>
      ${state.people.map(p => `<option value="${p.id}" ${c.assignee===p.id?'selected':''}>${p.name}</option>`).join('')}
    </select>
    <label>Due date</label>
    <input type="date" id="due" value="${c.due||''}" style="width:100%">
    <div class="actions">
      <button class="ghost" id="clear">Clear</button>
      <div>
        <button class="ghost" id="cancel">Cancel</button>
        <button class="primary" id="save">Save</button>
      </div>
    </div>
  `;
  document.getElementById('popoverRoot').appendChild(pop);
  const pw = 280, ph = pop.offsetHeight;
  pop.style.left = clamp(x, 8, window.innerWidth - pw - 8) + 'px';
  pop.style.top  = clamp(y, 8, window.innerHeight - ph - 8) + 'px';

  let newStatus = c.status;
  $$('#statusRow button', pop).forEach(b => b.onclick = () => {
    newStatus = b.dataset.s;
    $$('#statusRow button', pop).forEach(x => x.classList.remove('primary'));
    b.classList.add('primary');
  });
  $('#clear', pop).onclick = () => {
    c.status = 'not_started'; c.assignee = null; c.due = ''; c.completedAt = null;
    saveState(); closeEditor(); render();
  };
  $('#cancel', pop).onclick = closeEditor;
  $('#save', pop).onclick = () => {
    c.status = newStatus;
    c.assignee = $('#assignee', pop).value || null;
    c.due = $('#due', pop).value || '';
    if (newStatus === 'done' && !c.completedAt) c.completedAt = new Date().toISOString();
    if (newStatus !== 'done') c.completedAt = null;
    saveState(); closeEditor(); render();
  };
  setTimeout(() => document.addEventListener('click', outsideClose), 0);
}
function closeEditor() {
  document.getElementById('popoverRoot').innerHTML = '';
  document.removeEventListener('click', outsideClose);
}
function outsideClose(e) {
  if (!e.target.closest('.popover') && !e.target.closest('.cell')) closeEditor();
}

/* ---------- Calendar ---------- */
let calMonth = today();
function renderCalendar(root) {
  const events = calendarEvents();
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1);
  const start = startOfWeek(first);
  const days = [];
  for (let i=0; i<42; i++) days.push(addDays(start, i));

  const el = document.createElement('div');
  el.innerHTML = `
    <div class="toolbar">
      <button id="prev">‹</button>
      <b>${calMonth.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b>
      <button id="next">›</button>
      <div class="spacer"></div>
      ${state.people.map(p => `<span class="badge"><span style="color:${p.color}">●</span> ${p.name}</span>`).join('')}
    </div>
    <div class="cal">
      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')}
      ${days.map(d => {
        const ds = iso(d);
        const dayEvents = events.filter(e => e.date === ds);
        const isToday = iso(today()) === ds;
        const inMonth = d.getMonth() === m;
        return `
          <div class="day ${isToday?'today':''}" style="${inMonth?'':'opacity:.4'}">
            <div class="num">${d.getDate()}</div>
            ${dayEvents.slice(0,4).map(e => `
              <div class="evt" style="border-left-color:${e.person?e.person.color:'#666'}" title="${e.shot.number} · ${e.element.name} · ${e.stage.name}">
                ${e.shot.number} ${e.stage.name.slice(0,8)}
              </div>
            `).join('')}
            ${dayEvents.length > 4 ? `<div class="muted" style="font-size:10px;margin-top:2px">+${dayEvents.length-4} more</div>` : ''}
          </div>`;
      }).join('')}
    </div>
  `;
  root.appendChild(el);
  $('#prev', el).onclick = () => { calMonth = new Date(y, m-1, 1); render(); };
  $('#next', el).onclick = () => { calMonth = new Date(y, m+1, 1); render(); };
}

/* ---------- Gantt ---------- */
function renderGantt(root) {
  const rows = state.shots.map(shot => {
    let min = null, max = null, total = 0, done = 0;
    shot.elements.forEach(el => {
      state.stages.forEach(st => {
        const c = getCell(shot.id, el.id, st.id);
        if (c.due) {
          const d = new Date(c.due);
          if (!min || d < min) min = d;
          if (!max || d > max) max = d;
        }
        total++;
        if (c.status === 'done') done++;
      });
    });
    return { shot, min, max, progress: total ? done/total : 0 };
  }).filter(r => r.min && r.max);

  const projStart = new Date(state.project.start);
  const projEnd = new Date(state.project.deadline);
  const span = projEnd - projStart;
  const pct = d => clamp(((d - projStart) / span) * 100, 0, 100);

  const el = document.createElement('div');
  el.innerHTML = `
    <div class="gantt">
      <div class="axis">
        <span>${fmtDate(projStart)}</span>
        <span>Deadline ${fmtDate(projEnd)}</span>
      </div>
      ${rows.map(r => `
        <div class="grow">
          <div>
            <b>${r.shot.number}</b>
            <div class="meta">${Math.round(r.progress*100)}% · ${fmtDate(r.min)} → ${fmtDate(r.max)}</div>
          </div>
          <div class="gtrack">
            <div class="gbar" style="left:${pct(r.min)}%;width:${Math.max(2, pct(r.max)-pct(r.min))}%"></div>
            <div class="gfill" style="left:${pct(r.min)}%;width:${Math.max(2, (pct(r.max)-pct(r.min)) * r.progress)}%"></div>
          </div>
        </div>
      `).join('') || `<div class="muted">No scheduled shots. Add due dates in the shot list.</div>`}
    </div>
  `;
  root.appendChild(el);
}

/* ---------- Milestones ---------- */
function renderMilestones(root) {
  const weeks = weeklyActuals(8);
  const el = document.createElement('div');
  el.innerHTML = `
    <div class="section-title">Weekly target vs actual</div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Week starting</th><th>Required / week</th><th>Actual seconds</th><th>Shots finished</th><th>Status</th></tr></thead>
        <tbody>
          ${weeks.map(w => {
            const required = remainingSeconds() / Math.max(1, weeksUntilDeadline());
            const shots = state.shots.filter(s => s.elements.every(el =>
              state.stages.every(st => {
                const c = getCell(s.id, el.id, st.id);
                return c.status==='done' && c.completedAt &&
                  new Date(c.completedAt) >= w.weekStart &&
                  new Date(c.completedAt) < addDays(w.weekStart, 7);
              })
            )).length;
            const ok = w.seconds >= required * 0.9;
            return `
              <tr>
                <td>${fmtDate(w.weekStart)}</td>
                <td>${required.toFixed(1)}s</td>
                <td><b>${w.seconds.toFixed(1)}s</b></td>
                <td>${shots}</td>
                <td>${ok ? '<span class="chip s-done">on track</span>' : '<span class="chip s-in_progress">behind</span>'}</td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="section-title">Per-stage weekly target vs current speed</div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Stage</th><th>Remaining</th><th>Required / week</th><th>Current speed</th><th>Gap</th></tr></thead>
        <tbody>
          ${state.stages.map(st => {
            const remaining = totalSeconds() * (1 - stageCompletion(st.id));
            const req = remaining / weeksUntilDeadline();
            const speed = weeklySpeed(st.id, 4);
            const gap = speed - req;
            return `
              <tr>
                <td>${st.name}</td>
                <td>${remaining.toFixed(1)}s</td>
                <td>${req.toFixed(1)}s</td>
                <td>${speed.toFixed(1)}s</td>
                <td style="color:${gap>=0?'var(--green)':'var(--red)'}">${gap>=0?'+':''}${gap.toFixed(1)}s</td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
  root.appendChild(el);
}

    state.stages = state.stages.filter(s => s.id !== b.dataset.delstage); saveState(); render();
  });
  $$('[data-up]', el).forEach(b => b.onclick = () => {
    const i = Number(b.dataset.up); if (i<=0) return;
    [state.stages[i-1], state.stages[i]] = [state.stages[i], state.stages[i-1]]; saveState(); render();
  });
  $$('[data-down]', el).forEach(b => b.onclick = () => {
    const i = Number(b.dataset.down); if (i>=state.stages.length-1) return;
    [state.stages[i+1], state.stages[i]] = [state.stages[i], state.stages[i+1]]; saveState(); render();
  });
  $('#addStage2', el).onclick = () => {
    const name = prompt('Stage name:'); if (!name) return;
    state.stages.push({ id: uid(), name, weight: 1 }); saveState(); render();
  };
  $('#export', el).onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'production-workspace.json'; a.click();
  };
  $('#importJson', el).onclick = () => {
    const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
    inp.onchange = () => {
      const f = inp.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = async () => { try { state = JSON.parse(r.result); await saveState(); render(); } catch(e){ alert('Invalid JSON'); } };
      r.readAsText(f);
    };
    inp.click();
  };
  $('#reset', el).onclick = async () => {
    if (!confirm('Reset all data to seed?')) return;
    state = seed(); await saveState(); render();
  };
}

/* ---------- Tabs ---------- */
$$('#tabs button').forEach(b => b.onclick = () => {
  currentTab = b.dataset.tab;
  $$('#tabs button').forEach(x => x.classList.toggle('active', x === b));
  closeEditor();
  render();
});

/* ---------- Splash ---------- */
(function hideSplash(){
  const l = document.getElementById('splash');
  if (!l) return;
  let gone = false;
  function hide(){ if (gone) return; gone = true; l.classList.add('done'); setTimeout(()=>l.remove(), 700); }
  window.addEventListener('load', () => setTimeout(hide, Math.max(0, 1400 - performance.now())));
  setTimeout(hide, 5000);
})();

/* ---------- Boot ---------- */
(async function boot(){
  state = await loadState();
  render();
})();
</script>
